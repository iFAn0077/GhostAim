name: Extract ZIP

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Client.zip
        run: |
          mkdir -p extracted
          unzip -o Client.zip -d extracted

      - name: Move extracted files
        run: |
          cp -r extracted/* .
          rm -rf extracted

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Extract Client.zip" || echo "Nothing to commit"
          git push
